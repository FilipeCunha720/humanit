spring.application.name=humanit

# H2 in-memory database: data lives only in memory, everything is lost on shutdown.
spring.datasource.url=jdbc:h2:mem:clientsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tables are created by schema.sql and seeded by data.sql on every startup.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console